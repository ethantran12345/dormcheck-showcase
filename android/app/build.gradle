apply plugin: 'com.android.application'

// Upload-key signing secrets live outside VCS in android/key.properties (gitignored).
// Not included in this showcase.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.dormcheck.ios"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.dormcheck.android"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.01"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// Drop the Facebook SDK pulled transitively by @capgo/capacitor-social-login.
// We do not offer Facebook login (auth is Google + email/password; Microsoft is
// hidden pending Entra consent). facebook-core injects advertising-ID permissions
// (com.google.android.gms.permission.AD_ID + android.permission.ACCESS_ADSERVICES_*)
// into the merged manifest, forcing a "yes" on Play's Advertising ID declaration
// and implying device-identifier sharing with Meta we don't do. See
// docs/DECISIONS.md 2026-07-22.
configurations.all {
    exclude group: 'com.facebook.android'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Security guard (2026-08-01): a release build must never ship a dev
// live-reload config. android/app/src/main/assets/capacitor.config.json is
// gitignored and regenerated by every `cap sync`, so the commit-path guard
// (scripts/check-android-live-reload.mjs) cannot protect the BUILD path - a
// stale synced config with `server.url http://localhost:8080` + cleartext
// would ship an app loading its UI over cleartext HTTP. Fail the release
// build itself instead. Bypass knob intentionally absent.
def liveReloadGuard = tasks.register('checkNoLiveReloadConfig') {
    doLast {
        def cfg = file('src/main/assets/capacitor.config.json')
        if (cfg.exists() && cfg.text.contains('"server"')) {
            throw new GradleException(
                "Release build blocked: ${cfg} contains a dev 'server' block (live-reload URL). " +
                "Run a production `npx cap sync android` (no android:live) and rebuild.")
        }
    }
}
tasks.configureEach { t ->
    if (t.name == 'assembleRelease' || t.name == 'bundleRelease' || t.name == 'packageRelease') {
        t.dependsOn(liveReloadGuard)
    }
}
