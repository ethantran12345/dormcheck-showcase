name: Secrets Scan

# Scans for committed secrets with gitleaks (the CLI binary - license-free, unlike
# the org GitHub Action). Uses .gitleaks.toml at the repo root, which allowlists
# verified public-by-design values (Supabase anon keys, Mapbox pk. tokens - triaged
# 2026-06-28) while still failing on real secrets (service_role, sk., new keys).
#
# Scope differs by trigger ON PURPOSE:
#   - Push to dev: scan ONLY the commits this push introduces (before..after). This
#     is the gate that actually fires in normal DormCheck flow — the repo is
#     trunk-based and commits straight to dev, so the pull_request path below almost
#     never runs. Without this, a secret pushed to dev would sit undetected until the
#     next weekly sweep (up to 7 days). A finding fails the check inline AND opens a
#     redacted issue.
#   - Pull request: scan ONLY the commits the PR introduces (base..head). Immutable
#     git history is NOT re-scanned here - otherwise every PR would keep failing on
#     old public tokens that can't be changed. A finding fails the check inline.
#   - Weekly / manual: full repo + history sweep (defense in depth). A finding opens
#     a redacted issue. Secrets are masked (--redact); never paste a real value.
#
# ── NO `concurrency:` BLOCK HERE. THIS IS DELIBERATE. DO NOT ADD ONE. ────────────
# On 2026-08-16 `concurrency: { cancel-in-progress: true }` was added to
# ci-dev-push.yml, crash-gate.yml, edge-functions.yml and migration-guard.yml's
# tenant-isolation job, to stop a burst of trunk pushes stacking superseded runs.
# It was NOT added here, and this workflow is not eligible for it.
#
# Those four all evaluate the TIP COMMIT, so a newer run subsumes a cancelled one.
# This one is RANGE-scoped: on a push to dev it scans exactly `before..after`. Cancel
# a run and that range is never scanned by anything — the next push's range STARTS
# AFTER those commits, so a secret pushed in the cancelled window stays undetected
# until the weekly full-history sweep, up to 7 days later. The gap is silent: every
# run is green and nothing indicates a range was skipped.
#
# That is worth ~63 min/month. Leave it running.
#
# The same reasoning is why migration-guard.yml puts its `concurrency` block on the
# tenant-isolation JOB and not on the workflow: its Claude review half is range-scoped
# too. If you ever make this workflow tip-scoped (a full-history scan on every push),
# this carve-out expires — until then it holds.

on:
  schedule:
    - cron: '0 13 * * 1'   # ~9am ET Monday (UTC; may be delayed)
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history: needed for the base..head range and the weekly sweep

      - name: Install gitleaks
        run: |
          VER=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      # Push to dev: scan only the commits this push adds (before..after). This is
      # the gate that fires in normal trunk-based flow. Guard the first-push / branch-
      # create case where `before` is the all-zeros SHA (no prior ref) — fall back to
      # scanning just the tip commit rather than the whole history.
      - name: Scan pushed commits (diff-scoped, redacted)
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || \
             ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            RANGE="${AFTER_SHA}~1..${AFTER_SHA}"
          else
            RANGE="${BEFORE_SHA}..${AFTER_SHA}"
          fi
          echo "Scanning pushed range: $RANGE"
          gitleaks detect --source . --config .gitleaks.toml --redact \
            --log-opts="$RANGE" \
            --report-format json --report-path gitleaks-report.json --exit-code 1

      # PR: scan only the commits this PR adds. base..head = commits in head not in
      # base, i.e. exactly what the PR introduces. History is the weekly run's job.
      - name: Scan PR commits (diff-scoped, redacted)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks detect --source . --config .gitleaks.toml --redact \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --report-format json --report-path gitleaks-report.json --exit-code 1

      # Weekly / manual: full repo + history sweep (schedule + manual dispatch only).
      - name: Scan full history (redacted)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          gitleaks detect --source . --config .gitleaks.toml --redact \
            --report-format json --report-path gitleaks-report.json --exit-code 1

      - name: Open issue on findings (scheduled / manual run only)
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create security/secrets --color B60205 --force >/dev/null 2>&1 || true
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue create --title "Secrets scan: potential secret detected ($(date -u +%Y-%m-%d))" \
            --label security/secrets \
            --body "gitleaks flagged a potential secret (trigger: \`${{ github.event_name }}\`, values redacted in logs). Review the run, and if real, **rotate it immediately** and purge from history - do not paste the value here. Run: $RUN_URL"
